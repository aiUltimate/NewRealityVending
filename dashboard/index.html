<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Reality — Beta Command Center</title>
<style>
:root{--bg:#080812;--p:#111124;--p2:#181832;--line:#303052;--t:#f4f3ff;--m:#9999bb;--a:#987bff;--c:#55e5ff;--g:#5fe18d;--w:#ffc95e;--r:#ff7187}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#30205b,transparent 35%),var(--bg);color:var(--t);font:14px system-ui,sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:18px;background:#0b0b17;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;margin:8px}.logo i{color:var(--c);font-style:normal}.nav{margin-top:22px}.nav button{display:block;width:100%;border:0;background:none;color:var(--m);text-align:left;padding:9px 11px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.on{background:var(--p2);color:white}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:start}.head h1{margin:0;font-size:27px}.head p{color:var(--m);margin:5px 0 18px}.btn{border:1px solid var(--line);background:var(--p);color:white;padding:8px 12px;border-radius:8px;cursor:pointer}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(6,1fr)}.card{background:linear-gradient(145deg,#14142a,#0f0f1e);border:1px solid var(--line);border-radius:14px;padding:15px}.k{font-size:11px;color:var(--m)}.n{font-size:24px;font-weight:800;margin-top:5px}.sub{color:var(--g);font-size:11px}.layout{grid-template-columns:1.4fr .8fr;margin-top:12px}.map{min-height:400px;position:relative;overflow:hidden;background:radial-gradient(circle,#29224e,#111124 55%,#0b0b16)}.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:155px;height:155px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#7159d8,#25204d);box-shadow:0 0 80px #7b65ff55;border:1px solid #9b88ff}.node{position:absolute;width:150px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#15152bea;cursor:pointer}.node b{display:block}.node small{color:var(--m)}.tl{top:20px;left:20px}.tr{top:20px;right:20px}.bl{bottom:20px;left:20px}.br{bottom:20px;right:20px}.ml{top:44%;left:12px}.mr{top:44%;right:12px}.two{grid-template-columns:1fr 1fr}.modules{grid-template-columns:repeat(3,1fr);margin-top:12px}.module{min-height:120px;cursor:pointer}.module:hover{border-color:#6858ad}.module h3{margin:0 0 6px}.module p{color:var(--m);line-height:1.45;margin:0 0 10px}.pill{display:inline-block;padding:4px 7px;border-radius:20px;background:#272744;color:#d4ceff;font-size:10px}.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.toolbar select{background:#0b0b16;border:1px solid var(--line);color:white;padding:9px;border-radius:8px}.toolbar input{min-width:280px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.muted{color:var(--m)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--m)}a{color:var(--c);text-decoration:none}.hidden{display:none}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.kpis{grid-template-columns:repeat(3,1fr)}.layout,.two,.modules{grid-template-columns:1fr}}@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.main{padding:13px}}
</style></head><body><div class="app"><aside class="side"><div class="logo">NEW <i>REALITY</i></div><div class="muted" style="margin:0 8px">Organizational OS · Beta</div><div class="nav" id="nav"></div></aside><main class="main"><div class="head"><div><h1 id="title">Command Center</h1><p id="desc">Unified view of the company, project, evidence, economics and operating system.</p></div><button class="btn" onclick="download()">Export data</button></div><div id="view"></div></main></div>
<script>
let D=null,current="overview";
const repo="https://github.com/aiUltimate/NewRealityVending/blob/main/";
const mods={
overview:["⌂ Command Center","Whole system"],constitution:["◎ Constitution","Purpose, values, human agency"],governance:["◈ Governance","Authority, decisions, moderation"],projects:["◆ Projects","Project portfolio and roadmap"],intelligence:["✦ AI Intelligence","Research, prediction, optimization"],evidence:["◇ Evidence","Knowledge, sources, auditability"],compliance:["◉ Compliance","Rules, status, fail-closed controls"],products:["□ Products","SKU, batch, COA, product twins"],hardware:["▣ Hardware","Pods, devices, telemetry"],operations:["⚙ Operations","Daily/weekly/monthly execution"],economics:["$ Economics","Revenue, contribution, payback"],community:["○ Community","Ideas, capital, skills, feedback"],risk:["△ Risk","Threats, controls, stop conditions"],roadmap:["→ Roadmap","Stages and evidence gates"],data:["▤ Data Model","Entities, events, relationships"],sources:["☷ Repository","Source files and architecture"]};
fetch("../data/company-os.json").then(r=>r.json()).then(d=>{D=d;buildNav();render()}).catch(e=>document.getElementById("view").innerHTML='<div class="card">Load error: '+e+'</div>');
function buildNav(){document.getElementById("nav").innerHTML=Object.entries(mods).map(([k,v])=>'<button data-k="'+k+'" onclick="go(\''+k+'\')">'+v[0]+'</button>').join("")}
function go(k){current=k;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.k===k));document.getElementById("title").textContent=mods[k][0].replace(/^\S+ /,"");document.getElementById("desc").textContent=mods[k][1];render()}
function card(k,n,s){return '<div class="card"><div class="k">'+k+'</div><div class="n">'+n+'</div><div class="sub">'+s+'</div></div>'}
function list(a){return '<div>'+a.map(x=>'<div class="row">'+x+'</div>').join("")+'</div>'}
function render(){let v=document.getElementById("view");if(current==="overview")return overview(v);if(current==="sources")return sources(v);if(current==="data")return data(v);let key={governance:"governance",projects:"roadmap",intelligence:"ai",evidence:"constitution",compliance:"compliance",products:"product_system",hardware:"hardware",operations:"moderator_ops",economics:"economics",risk:"risk",community:"constitution",constitution:"constitution"}[current];generic(v,key)}
function overview(v){v.innerHTML='<div class="grid kpis">'+card("Modules",Object.keys(mods).length,"connected surfaces")+card("Core entities",D.core_entities.length,"shared data model")+card("Event types",D.event_types.length,"auditable history")+card("Roadmap phases",D.roadmap.length,"evidence gates")+card("Risk categories",Object.keys(D.risk.categories).length,"monitored domains")+card("Source files",D.repository_sources.length,"extracted from repo")+'</div><div class="grid layout"><div class="card map"><div class="core"><div><b>NEW REALITY</b><br><span class="muted">Organizational OS</span></div></div>'+node("tl","Constitution","DNA · values · agency","constitution")+node("tr","Human + AI","Intelligence · decisions","intelligence")+node("bl","Economics","Capital · revenue · reinvestment","economics")+node("br","Execution","Products · Pods · operations","operations")+node("ml","Evidence","Knowledge · memory · audit","evidence")+node("mr","Immune System","Compliance · risk · moderation","compliance")+'</div><div><div class="card"><b>System equation</b>'+list(["Purpose → Design → Project","Evidence → Decision → Action","Capital → Execution → Value","Results → Measurement → Learning","Learning → Memory → Next Project"])+'</div><div class="card" style="margin-top:12px"><b>Critical decision rules</b>'+list(D.decision_rules)+'</div></div></div><div class="grid modules">'+Object.entries(mods).filter(x=>x[0]!=="overview").map(([k,x])=>'<div class="card module" onclick="go(\''+k+'\')"><h3>'+x[0].replace(/^\S+ /,"")+'</h3><p>'+x[1]+'</p><span class="pill">open module</span></div>').join("")+'</div>'}
function node(c,a,b,k){return '<div class="node '+c+'" onclick="go(\''+k+'\')"><b>'+a+'</b><small>'+b+'</small></div>'}
function generic(v,key){let o=D[key];let title=mods[current][0].replace(/^\S+ /,"");let html='<div class="card"><h2>'+title+'</h2><p class="muted">Structured from the repository. This surface is a view over the shared company data model, not a separate database.</p>';html+=obj(o);html+='</div>';v.innerHTML=html}
function obj(o){if(Array.isArray(o))return list(o.map(x=>typeof x==="object"?obj(x):String(x)));if(o&&typeof o==="object")return Object.entries(o).map(([k,v])=>'<div style="margin:15px 0"><b>'+k.replaceAll("_"," ")+'</b>'+obj(v)+'</div>').join("");return '<div class="muted" style="margin-top:6px">'+String(o)+'</div>'}
function data(v){v.innerHTML='<div class="grid two"><div class="card"><h2>Entities</h2>'+list(D.core_entities)+'</div><div class="card"><h2>Event stream</h2>'+list(D.event_types)+'</div></div><div class="card" style="margin-top:12px"><h2>Relationship graph</h2>'+list(D.data_model.relationships)+'</div><div class="card" style="margin-top:12px"><h2>Connector strategy</h2>'+list(D.data_model.connector_strategy)+'</div>'}
function sources(v){v.innerHTML='<div class="card"><h2>Repository source catalog</h2><p class="muted">Every listed source was extracted into the unified company model. Open the original document when exact wording or evidence is required.</p><table><thead><tr><th>Source</th><th>Type</th><th>Role</th></tr></thead><tbody>'+D.repository_sources.map(p=>'<tr><td><a href="'+repo+p+'" target="_blank">'+p+'</a></td><td>'+((p.endsWith(".json")?"Schema":p.endsWith(".csv")?"Data":"Document"))+'</td><td>'+role(p)+'</td></tr>').join("")+'</tbody></table></div>'}
function role(p){if(p.includes("CONSTITUTION"))return"Foundational organizational DNA";if(p.includes("LEGAL"))return"Jurisdiction research baseline";if(p.includes("AI"))return"AI architecture";if(p.includes("COMPLIANCE"))return"Machine-readable compliance";if(p.includes("DATA-ARCH"))return"Data architecture";if(p.includes("PRODUCT"))return"Product digital twin";if(p.includes("HARDWARE"))return"Pod specification";if(p.includes("SOFTWARE"))return"Adaptive OS services";if(p.includes("ECONOMICS"))return"Unit economics";if(p.includes("RISK"))return"Risk register";if(p.includes("VENUE"))return"Pilot architecture";if(p.includes("CROWDFUND"))return"Funding architecture";if(p.includes("MODERATOR"))return"Founder operating system";if(p.includes("schema"))return"Machine-readable schema";if(p.includes("SPENDING"))return"Financial ledger";return"Company/project source"}
function download(){let b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="new-reality-company-os.json";a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
